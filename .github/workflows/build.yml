name: 🚀 Build GharSync APK (Expo + EAS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 📱 Build Android APK (Free)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Setup Expo Token
        run: echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV

      - name: 📱 Build APK via EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-local-fallback:
    name: 🔨 Local Build Fallback (No EAS Token Needed)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔧 Install Expo CLI
        run: npm install -g expo-cli @expo/eas-cli

      - name: 📲 Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: 📛 Rename APK
        run: |
          DATE=$(date +'%Y%m%d')
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             GharSync-v1.0-${DATE}.apk
          echo "APK_FILE=GharSync-v1.0-${DATE}.apk" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rn-v1.0.${{ github.run_number }}
          name: "GharSync RN v1.0.${{ github.run_number }}"
          body: |
            ## 📱 GharSync — React Native + Expo
            
            ### ✨ What's New
            - Complete rebuild in React Native + Expo
            - WhatsApp-style group chat interface
            - AI grocery parser (Urdu + Roman Urdu + English)
            - 4-tab navigation: Chats | Grocery | Shopping | More
            
            ### 📥 How to Install
            1. Download `GharSync-*.apk` below
            2. On phone: Settings → Security → **Unknown Sources → Enable**
            3. Open APK → Install → Done ✅
            
            ### Requirements
            - Android 5.0 (Lollipop) or higher
          files: ${{ env.APK_FILE }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
