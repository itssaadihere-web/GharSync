name: 🚀 Build & Release GharSync APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android builds)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter (stable channel)
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: 📦 Install Dependencies
        run: flutter pub get

      # 5. Decode the keystore from GitHub Secrets (for signing)
      - name: 🔐 Decode Keystore
        if: ${{ env.KEY_STORE_BASE64 != '' }}
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > android/gharsync-release.jks

      # 6. Write key.properties from secrets (if available)
      - name: 📝 Create key.properties
        if: ${{ env.STORE_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gharsync-release.jks
          EOF

      # 7. Build release APK
      - name: 🔨 Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 8. Rename APK with version + date
      - name: 📛 Rename APK
        run: |
          DATE=$(date +'%Y%m%d')
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/GharSync-v${VERSION}-${DATE}.apk
          echo "APK_NAME=GharSync-v${VERSION}-${DATE}.apk" >> $GITHUB_ENV

      # 9. Upload APK as build artifact (always available, no release needed)
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      # 10. Create GitHub Release with APK attached
      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "GharSync v1.0.${{ github.run_number }}"
          body: |
            ## 📱 GharSync - Family Household Manager
            
            ### What's New
            - Latest build from main branch
            - Commit: ${{ github.sha }}
            
            ### 📥 How to Install
            1. Download `GharSync-*.apk` below
            2. On your Android phone: Settings → Security → Enable **"Install from unknown sources"**
            3. Open the downloaded APK and tap **Install**
            4. Done! GharSync is installed ✅
            
            ### Requirements
            - Android 5.0 (Lollipop) or higher
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # BONUS: Build AAB for Play Store (only when keystore secrets are set)
  build-aab:
    name: Build Play Store AAB
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Decode Keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          echo "$KEY_STORE_BASE64" | base64 --decode > android/gharsync-release.jks

      - name: 📝 Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gharsync-release.jks
          EOF

      - name: 📦 Build Release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GharSync-PlayStore.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
